<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>巡堂紀錄</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700&display=swap"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style id="app-style">
/* 設計：手機直向單欄，頂部固定「現在巡堂」資訊條 + 分頁籤（填寫／歷史），卡片式清單 */
:root{
  --bg:#f6f2e9; --surface:#ffffff; --surface-2:#eee6d4; --ink:#2a2620; --ink-soft:#766d5c;
  --accent:#2d5d78; --accent-soft:#e3edf1; --accent-ink:#17323f;
  --good:#3f7a4f; --good-soft:#e6f1e7; --bad:#b3493f; --bad-soft:#f7e8e4; --warn:#a8781f; --warn-soft:#f5ecd6;
  --border:#ddd3ba; --shadow:0 1px 3px rgba(42,38,32,.08);
  --font-display:'Noto Serif TC', serif; --font-body:'Noto Sans TC','PingFang TC',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1815; --surface:#242019; --surface-2:#2f2a22; --ink:#ece4d4; --ink-soft:#a79b84;
    --accent:#7fb3cf; --accent-soft:#223640; --accent-ink:#d8ecf4;
    --good:#86c295; --good-soft:#1f3324; --bad:#e2897c; --bad-soft:#3a2420; --warn:#dcb45a; --warn-soft:#3a2f18;
    --border:#423b2f; --shadow:0 1px 3px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1815; --surface:#242019; --surface-2:#2f2a22; --ink:#ece4d4; --ink-soft:#a79b84;
  --accent:#7fb3cf; --accent-soft:#223640; --accent-ink:#d8ecf4;
  --good:#86c295; --good-soft:#1f3324; --bad:#e2897c; --bad-soft:#3a2420; --warn:#dcb45a; --warn-soft:#3a2f18;
  --border:#423b2f; --shadow:0 1px 3px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
#app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px 32px;}
h1,h2,h3{font-family:var(--font-display);margin:0;}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--border);margin-bottom:12px;}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
.brand h1{font-size:20px;font-weight:700;color:var(--accent-ink);}
.brand .sub{font-size:12px;color:var(--ink-soft);}
.nav-link-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.nav-link-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--surface);color:var(--accent);border-radius:999px;padding:6px 13px;font-weight:700;font-size:12px;font-family:var(--font-body);text-decoration:none;}
.nav-link-btn:hover{background:var(--accent-soft);}
.now-banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;color:var(--accent-ink);margin-bottom:8px;}
.now-banner b{font-weight:700;}
.now-banner .duty{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;}
.now-banner .duty-name{font-size:15px;font-weight:700;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab-btn{flex:1 1 46%;padding:9px 0;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);border-radius:10px;font-family:var(--font-body);font-size:14px;font-weight:700;cursor:pointer;}
.tab-btn[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.field .hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
.row2{display:flex;gap:10px;}
.row2 > *{flex:1;min-width:0;}
input[type="date"],input[type="month"],input[type="text"],select,textarea{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);font-family:var(--font-body);font-size:14px;}
textarea{resize:vertical;min-height:64px;}
input::placeholder,textarea::placeholder{color:var(--ink-soft);}
.chip-grid{display:flex;flex-wrap:wrap;gap:6px;}
.chip{border:1px solid var(--border);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:12.5px;cursor:pointer;font-family:var(--font-body);line-height:1.3;}
.chip[aria-pressed="true"].good-chip{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700;}
.chip[aria-pressed="true"].bad-chip{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:700;}
.score-row{display:flex;gap:6px;}
.score-btn{flex:1;padding:10px 0;border:1px solid var(--border);background:var(--surface-2);border-radius:10px;font-family:var(--font-body);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);}
.score-btn[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#2a2008;}
.btn-primary{width:100%;padding:12px 0;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:var(--font-body);font-size:15px;font-weight:700;cursor:pointer;}
.btn-primary:disabled{opacity:.5;}
.btn-ghost{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--ink-soft);font-size:12.5px;cursor:pointer;font-family:var(--font-body);}
.btn-link{border:none;background:transparent;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;padding:0;font-family:var(--font-body);}
.btn-danger{border:none;background:transparent;color:var(--bad);font-size:12.5px;font-weight:700;cursor:pointer;padding:0;font-family:var(--font-body);}
.suggest-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.filters select,.filters input{flex:1;min-width:110px;}
.record{border-bottom:1px solid var(--border);padding-block:12px;}
.record:last-child{border-bottom:none;}
.record-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;}
.record-when{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.record-class{font-size:15px;font-weight:700;color:var(--accent-ink);}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;}
.badge-sched{background:var(--good-soft);color:var(--good);}
.badge-adhoc{background:var(--warn-soft);color:var(--warn);}
.badge-secondlang{background:var(--accent-soft);color:var(--accent-ink);}
.record-name{font-size:13.5px;margin-top:2px;}
.record-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;}
.tag-good{background:var(--good-soft);color:var(--good);}
.tag-bad{background:var(--bad-soft);color:var(--bad);}
.record-note{font-size:13px;color:var(--ink-soft);margin-top:6px;white-space:pre-wrap;}
.record-actions{margin-top:8px;display:flex;gap:14px;}
.empty{text-align:center;color:var(--ink-soft);font-size:13.5px;padding:30px 10px;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:50;box-shadow:var(--shadow);}
.export-bar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px;}
.sync-bar{font-size:13px;padding:8px 12px;border-radius:8px;margin-bottom:10px;}
.sync-bar-loading{background:var(--accent-soft);color:var(--accent-ink);}
.sync-bar-error{background:var(--warn-soft);color:var(--warn);}
.score-legend{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
@media (max-width:420px){ .row2{flex-direction:column;} }
/* 寬螢幕（桌機/平板橫向）：內容欄位放寬，分頁籤不再被迫擠成兩排；手機版（下方未覆蓋的規則）完全不受影響 */
@media (min-width:900px){
  #app{max-width:980px;}
  .tab-btn{flex:1 1 0;}
}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.stat-tile{background:var(--surface-2);border-radius:12px;padding:10px 12px;}
.stat-value{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--accent-ink);line-height:1.25;}
.stat-value.small{font-size:14px;line-height:1.5;}
.stat-label{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
@media (min-width:640px){
  .stat-grid{grid-template-columns:repeat(4,1fr);}
}

var STAFF = JSON.parse(document.getElementById('staff-data').textContent);
var ROSTER = JSON.parse(document.getElementById('roster-data').textContent);
var CLASSES = JSON.parse(document.getElementById('class-data').textContent);
var CHECKLIST = JSON.parse(document.getElementById('checklist-data').textContent);
var CLASS_GRIDS = JSON.parse(document.getElementById('class-grids-data').textContent);
// Google 試算表裡沒填評分的儲存格，後端 doGet 會讀成空字串 ''，不是 null／undefined
// （Apps Script 對空白儲存格就是回傳 ''）。但前端表單新建紀錄時沒選評分存的是 null
// （見 uiState.form.score 初始值）。這兩種「沒有評分」的表示法不一致，如果不統一，
// 任何用 "r.score != null" 判斷有沒有評分的地方都會把 '' 誤判成「有評分」，
// 之後 0+'' 這種運算會讓數字悄悄變成字串、跟後面的數字字串接在一起，
// 總覽頁籤平均分數就是因為這樣跑出 3.77e+116 這種異常大的數字。
// 統一在「資料進來的這一刻」就把沒評分的狀況全部正規化成 null，後面全部程式碼都不用再各自處理這個落差。
function normalizeRecords(list){
  return (list || []).map(function(r){
    if(r.score === '' || r.score === undefined || r.score === null || isNaN(Number(r.score))){
      r.score = null;
    }else{
      r.score = Number(r.score);
    }
    return r;
  });
}
// RECORDS 一開始先用發布當下內嵌的快照（離線/連不到資料庫時的備援），
// 頁面載入後會立刻改抓 Google 試算表資料庫的最新資料覆蓋過去（見 fetchRecordsFromServer）。
var RECORDS = normalizeRecords(JSON.parse(document.getElementById('patrol-records').textContent));

// ============ 巡堂紀錄資料庫（Google 試算表 + Apps Script）============
// 真正的資料庫已經搬到 Google 試算表，這個網址是巡堂紀錄系統讀寫資料庫用的 API。
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwiMFO55ErsPuTqmdHIqnlT1vXD8xy69ENQgt_doAK_bg6Z3m1p4vdCzqKbOR3zVDKn/exec';

function apiGet(){
  return fetch(APPS_SCRIPT_URL).then(function(res){ return res.json(); });
}
function apiPost(body){
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'}, // 刻意用 text/plain 避免瀏覽器送出 CORS 預檢請求
    body: JSON.stringify(body)
  }).then(function(res){ return res.json(); });
}
// 頁面載入時非同步向資料庫要最新資料，成功就整批換掉 RECORDS 並重繪；
// 失敗（離線、網路不穩）就維持原本內嵌的快照，並提示使用者目前看到的可能不是最新資料。
function fetchRecordsFromServer(isManualRefresh){
  uiState.loading = true;
  uiState.syncError = null;
  render();
  return apiGet().then(function(resp){
    if(resp && resp.ok && Array.isArray(resp.records)){
      RECORDS = normalizeRecords(resp.records);
      uiState.loading = false;
      uiState.syncError = null;
      uiState.initialLoadDone = true;
      render();
      if(isManualRefresh) showToast('已更新為最新資料。');
    }else{
      throw new Error((resp && resp.error) || '未知錯誤');
    }
  }).catch(function(err){
    uiState.loading = false;
    uiState.syncError = '無法連線到巡堂紀錄資料庫，目前顯示的是上次連線成功時的資料。';
    uiState.initialLoadDone = true;
    render();
    if(isManualRefresh) showToast('更新失敗，請確認網路連線後再試一次。');
  });
}

// 逐週核對校對（用「第 N 次返家」事件固定出現在淨空週的規律交叉驗證過，21 週全部吻合）。

// 所以直接整週設為非淨空週，不再用單日覆寫處理。
var WEEK_CALENDAR = [
  {start:'2026-08-30', end:'2026-09-05', weekType:'非淨空週'},

// 巡堂日範圍內，也視為不排定巡堂（dateToInfo 回傳 valid:false），不會被課表帶出建議。
var HOLIDAYS = ['2026-09-25', '2026-10-09', '2026-10-10', '2026-10-25', '2027-01-01'];
var DAYS = {'非淨空週':['一','二','三','四','五','六','日'], '淨空週':['一','二','三','四','五']};
var DAY_LABELS_BY_UTC = ['日','一','二','三','四','五','六'];
var PERIODS = [
  {key:'1', label:'第1節', start:'08:10', end:'09:00'},
  {key:'2', label:'第2節', start:'09:10', end:'10:00'},
  {key:'3', label:'第3節', start:'10:10', end:'11:00'},
  {key:'4', label:'第4節', start:'11:10', end:'11:55'},
  {key:'5', label:'第5節', start:'13:20', end:'14:10'},

  {key:'8', label:'第8節', start:'16:30', end:'17:15'}
];
var PROS = CHECKLIST.pros, CONS = CHECKLIST.cons;
var SCORE_LABELS = {1:'不佳', 2:'尚可', 3:'良好', 4:'優良'};

function pad2(n){ return n<10 ? ('0'+n) : String(n); }
function parseISODateUTC(s){ var p=s.split('-').map(Number); return new Date(Date.UTC(p[0],p[1]-1,p[2])); }
function formatISODateUTC(d){ return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate()); }
function addDaysUTC(d,n){ return new Date(d.getTime()+n*86400000); }
var SEMESTER_START = WEEK_CALENDAR[0].start;
var SEMESTER_END = WEEK_CALENDAR[WEEK_CALENDAR.length-1].end;

function dateToInfo(dateStr){
  if(!dateStr) return null;
  var d = parseISODateUTC(dateStr);
  var day = DAY_LABELS_BY_UTC[d.getUTCDay()];
  var weekEntry = null;
  for(var i=0;i<WEEK_CALENDAR.length;i++){
    var wk = WEEK_CALENDAR[i];
    if(dateStr >= wk.start && dateStr <= wk.end){ weekEntry = wk; break; }
  }
  var inRange = !!weekEntry;
  var weekType = weekEntry ? weekEntry.weekType : null;
  if(inRange && DAY_OVERRIDES[dateStr]) weekType = DAY_OVERRIDES[dateStr].weekType;
  // 淨空週的「返校週日」：學生其實還在校（上一週非淨空週/淨空週留下來的，直到這週五才真正離校返家），
  // 課表與巡堂輪值當天都是照非淨空週走，只有週六才是真正淨空。所以每個淨空週區間自己的第一天（週日）
  // 要當非淨空週處理，不能直接整段都當淨空週（使用者 2026-10-08 以 9/6、9/20 兩筆實際紀錄確認過）。
  if(inRange && weekType === '淨空週' && day === '日' && dateStr === weekEntry.start){
    weekType = '非淨空週';
  }
  var isHoliday = HOLIDAYS.indexOf(dateStr) !== -1;
  var validDay = inRange && weekType && DAYS[weekType].indexOf(day) !== -1 && !isHoliday;
  return {date:dateStr, weekType:weekType, day:day, inRange:inRange, valid:validDay, holiday:isHoliday};
}

// 台北時間（UTC+8），不依賴瀏覽器所在時區
function taipeiNow(){
  var utcMs = Date.now();
  var tpe = new Date(utcMs + 8*3600000);
  var dateStr = tpe.getUTCFullYear()+'-'+pad2(tpe.getUTCMonth()+1)+'-'+pad2(tpe.getUTCDate());
  var hhmm = pad2(tpe.getUTCHours())+':'+pad2(tpe.getUTCMinutes());
  return {dateStr:dateStr, hhmm:hhmm};
}
function currentPeriodKey(hhmm){
  for(var i=0;i<PERIODS.length;i++){
    if(hhmm >= PERIODS[i].start && hhmm <= PERIODS[i].end) return PERIODS[i].key;
  }
  return null;
}
function dutyFor(weekType, day, periodKey){
  if(!weekType || !day || !periodKey) return null;
  var byDay = ROSTER[weekType] && ROSTER[weekType][day];
  if(!byDay) return null;
  return byDay[periodKey] || null;
}

// 查課表：這堂課排的科目、任課老師（可能不只一位，例如雙班導班會、生命課法師+班導、英語協同教學）。
// 只用來「帶出建議」，因為實際上課的人可能因為調代課而跟課表不一樣，巡堂人要能自行覆寫。
function lookupSubjectTeacher(className, weekType, day, periodKey){
  if(!className || !weekType || !day || !periodKey) return null;
  var grid = CLASS_GRIDS[className];
  if(!grid) return null;
  var entries = grid[weekType] && grid[weekType][day + '-' + periodKey];
  if(!entries || !entries.length) return null;
  var subject = entries[0].subject;
  var teacherNames = [];
  var noteTexts = [];
  entries.forEach(function(e){
    if(e.teacher && teacherNames.indexOf(e.teacher) === -1) teacherNames.push(e.teacher);
    if(e.note && noteTexts.indexOf(e.note) === -1) noteTexts.push(e.note);
  });
  return {subject: subject, teacherNames: teacherNames, noteTexts: noteTexts};
}

function getDeviceToken(){
  try{

    if(!t){
      t = (crypto && crypto.randomUUID) ? crypto.randomUUID() : ('dev-'+Math.random().toString(36).slice(2)+Date.now());
      localStorage.setItem('patrol_device_token', t);
    }
    return t;
  }catch(e){ return 'no-storage'; }
}
var DEVICE_TOKEN = getDeviceToken();

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function freshForm(prefillSuggest){
  var now = taipeiNow();

  return {
    date: now.dateStr,

    className: '',

    subject: '',

    subjectTeacher: '',
    subjectTeacherTouched: false,
    pros: {},
    cons: {},
    score: null,
    note: ''
  };

// 依目前表單的 班級／日期／節次 重新查課表，把建議的課程名稱／任課老師帶進欄位；如果這些欄位已經被
// 使用者自己改過（調代課、巡堂當下看到的不是課表上那堂課/那個人），就不要再蓋過去（各自獨立判斷）。
function refreshSubjectTeacherSuggestion(){
  var f = uiState.form;
  var info = dateToInfo(f.date);
  var className = (f.className === '__other__' || f.className === '__secondlang__') ? null : f.className;
  var hit = (info && info.valid && className) ? lookupSubjectTeacher(className, info.weekType, info.day, f.period) : null;
  if(!f.subjectTouched){
    f.subject = (hit && hit.subject) ? hit.subject : '';
  }
  if(!f.subjectTeacherTouched){
    f.subjectTeacher = (hit && hit.teacherNames.length) ? hit.teacherNames.join('、') : '';
  }
}

var isReadOnly = false;

// ============ 共享狀態存檔（Google 試算表 + Apps Script）============
// 新增/編輯一筆紀錄：先等資料庫回應成功才更新畫面，避免「看起來存了、其實沒存到」的情況。
function saveOneRecord(rec, successMsg, onDone){
  uiState.syncing = true;
  render();
  apiPost({action:'upsert', record:rec}).then(function(resp){
    uiState.syncing = false;
    if(resp && resp.ok){
      var exists = RECORDS.some(function(r){ return r.id === rec.id; });
      RECORDS = exists ? RECORDS.map(function(r){ return r.id === rec.id ? rec : r; }) : RECORDS.concat([rec]);
      if(onDone) onDone(true);
      render();
      if(successMsg) showToast(successMsg);
    }else{
      if(onDone) onDone(false);
      render();
      showToast('儲存失敗：' + ((resp && resp.error) || '請稍後再試一次') + '，請確認資料無誤後重新送出。');
    }
  }).catch(function(){
    uiState.syncing = false;
    if(onDone) onDone(false);
    render();
    showToast('無法連線到巡堂紀錄資料庫，請確認網路連線後再試一次（剛剛填的內容還留著，不用重新輸入）。');
  });
}

  apiPost({action:'delete', id:id}).then(function(resp){
    uiState.syncing = false;
    if(resp && resp.ok){
      RECORDS = RECORDS.filter(function(r){ return r.id !== id; });
      render();
      if(successMsg) showToast(successMsg);
    }else{
      render();
      showToast('刪除失敗：' + ((resp && resp.error) || '請稍後再試一次'));

  }).catch(function(){
    uiState.syncing = false;
    render();
    showToast('無法連線到巡堂紀錄資料庫，請確認網路連線後再試一次。');
  });
}
// 批次匯入多筆（舊版 Google 表單紀錄匯入用）：一次性送給資料庫，減少等待次數。

// ============ 表單操作 ============
function onSubmit(){
  var f = uiState.form;
  var info = dateToInfo(f.date);
  if(!info || !info.valid){ showToast('這個日期不在本學期課表範圍內，請重新選擇日期。'); return; }
  var isFreeLocation = (f.grade === '__other__' || f.grade === '__secondlang__');
  var className = isFreeLocation ? (f.classOther||'').trim() : f.className;
  if(!className){ showToast('請選擇或填寫巡堂的班級／地點。'); return; }
  var patrolName = (f.patrolName||'').trim();
  if(!patrolName){ showToast('請填寫巡堂人姓名。'); return; }
  var duty = dutyFor(info.weekType, info.day, f.period);
  var scheduled = !!(duty && duty.name === patrolName);
  var proList = Object.keys(f.pros).filter(function(k){ return f.pros[k]; });
  var conList = Object.keys(f.cons).filter(function(k){ return f.cons[k]; });
  var rec = {
    id: uiState.editingId || uid(),
    createdAt: uiState.editingId ? (findRecord(uiState.editingId)||{}).createdAt : new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    date: f.date, weekType: info.weekType, day: info.day, period: f.period,
    className: className, patrolName: patrolName, scheduled: scheduled,
    subject: (f.subject||'').trim(),
    subjectTeacher: (f.subjectTeacher||'').trim(),
    pros: proList, cons: conList, score: f.score, note: (f.note||'').trim(),
    category: f.grade === '__secondlang__' ? '二外' : '',
    creatorToken: uiState.editingId ? (findRecord(uiState.editingId)||{}).creatorToken : DEVICE_TOKEN
  };
  var msg = uiState.editingId ? '已更新這筆巡堂紀錄。' : '已送出巡堂紀錄。';
  var wasEditing = !!uiState.editingId;
  // 先送到資料庫，確定存成功後才清空表單——這樣萬一網路不通，
  // 剛剛填的內容還留在畫面上，不用重新輸入一次，按一次送出就能重試。
  // 新增紀錄：送出成功後留在「填寫巡堂」頁籤（表單已清空、可以直接接著送下一筆），
  // 靠畫面下方跳出的提示文字確認有存成功，不用每次都要再點一次「填寫巡堂」。
  // 編輯既有紀錄：維持原本行為，送出成功後跳回「歷史紀錄」頁籤（本來就是從那邊點進來修改的）。
  saveOneRecord(rec, msg, function(success){
    if(success){
      uiState.editingId = null;
      uiState.form = freshForm(true);
      refreshSubjectTeacherSuggestion();

// ============ 匯出 CSV ============
function csvEscape(v){
  v = String(v==null?'':v);
  if(/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}
function buildCsv(list){
  var header = ['日期','星期','週別','節次','班級／地點','課程名稱','任課老師','巡堂人','是否為輪值人員','優點','缺點','評分','備註','填寫時間'];
  var lines = [header.join(',')];
  list.forEach(function(r){
    lines.push([
      r.date, r.day, r.weekType, r.period, r.className, r.subject || '', r.subjectTeacher || '', r.patrolName,
      r.scheduled ? '輪值人員' : '主動巡堂',
      (r.pros||[]).join('、'), (r.cons||[]).join('、'),
      r.score ? (r.score + '（' + (SCORE_LABELS[r.score]||'') + '）') : '',
      r.note, r.createdAt
    ].map(csvEscape).join(','));
  });
  return '﻿' + lines.join('\r\n');
}
function exportCsv(){
  var list = filteredRecords();
  var csv = buildCsv(list);
  // 一般網頁可以直接用瀏覽器原生下載（Blob + <a download>），不需要額外的平台能力。
  try{
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    // 檔名刻意只用英數字：測試發現部分瀏覽器版本的 download 屬性若放中文檔名，
    // 存檔對話框會直接顯示成沒有副檔名的「download」，反而更不清楚是什麼檔案。
    a.download = 'patrol_log_'+taipeiNow().dateStr+'.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast('已匯出 CSV。');
  }catch(e){
    fallbackShowCsv(csv);
  }
}
function fallbackShowCsv(csv){
  uiState.csvPreview = csv;
  render();
  showToast('此檢視無法直接下載檔案，內容已列在下方可自行複製。');
}
function copyCsv(){
  try{
    navigator.clipboard.writeText(uiState.csvPreview).then(function(){ showToast('已複製到剪貼簿。'); });
  }catch(e){ showToast('複製失敗，請手動選取文字複製。'); }
}

// ============ 總覽（待關注清單 + 老師總覽表） ============
// 「待關注」判斷標準：評分 1-2 分、缺點標籤含「老師遲進教室」或「老師控班不佳」；
// 同一位任課老師在近 4 週內累計達到門檻次數時，額外標記「重複」並排到最前面。
var FLAGGED_CONS = ['老師遲進教室', '老師控班不佳'];
var ATTENTION_WINDOW_DAYS = 28;
var ATTENTION_REPEAT_THRESHOLD = 2;

function issueReasons(r){
  var reasons = [];
  if(r.score != null && r.score <= 2) reasons.push('評分 ' + r.score + ' 分');
  (r.cons || []).forEach(function(c){ if(FLAGGED_CONS.indexOf(c) !== -1) reasons.push(c); });
  return reasons;
}
function daysBetweenISO(fromStr, toStr){
  return Math.round((parseISODateUTC(toStr).getTime() - parseISODateUTC(fromStr).getTime()) / 86400000);
}
function computeAttention(records){
  var today = taipeiNow().dateStr;
  var issues = [];
  (records || RECORDS).forEach(function(r){
    var reasons = issueReasons(r);
    if(reasons.length) issues.push({record: r, reasons: reasons.slice(), repeatCount: 0});
  });
  var recentByTeacher = {};
  issues.forEach(function(it){
    var t = (it.record.subjectTeacher || '').trim();
    if(!t) return;
    var ageDays = daysBetweenISO(it.record.date, today);
    if(ageDays >= 0 && ageDays <= ATTENTION_WINDOW_DAYS){
      (recentByTeacher[t] = recentByTeacher[t] || []).push(it);
    }
  });
  Object.keys(recentByTeacher).forEach(function(t){
    var list = recentByTeacher[t];
    if(list.length >= ATTENTION_REPEAT_THRESHOLD){
      list.sort(function(a,b){ return a.record.date.localeCompare(b.record.date); });
      list.forEach(function(it, idx){
        it.reasons.push('近4週內第 ' + (idx+1) + ' 次');
        it.repeatCount = list.length;
      });
    }
  });
  issues.sort(function(a,b){
    if(b.repeatCount !== a.repeatCount) return b.repeatCount - a.repeatCount;
    return (b.record.date + b.record.period).localeCompare(a.record.date + a.record.period);
  });
  return issues;
}
function computeTeacherSummary(records){
  var today = taipeiNow().dateStr;
  var byTeacher = {};
  (records || RECORDS).forEach(function(r){
    var t = (r.subjectTeacher || '').trim();
    if(!t) return;
    var e = byTeacher[t] = byTeacher[t] || {teacher:t, count:0, scoreSum:0, scoreCount:0, lastDate:null, issueCount:0, recentIssueCount:0, deptSet:{}};
    e.count++;
    if(r.score != null){ e.scoreSum += r.score; e.scoreCount++; }
    if(!e.lastDate || r.date > e.lastDate) e.lastDate = r.date;
    e.deptSet[recordDept(r)] = true;
    var reasons = issueReasons(r);
    if(reasons.length){
      e.issueCount++;
      var ageDays = daysBetweenISO(r.date, today);
      if(ageDays >= 0 && ageDays <= ATTENTION_WINDOW_DAYS) e.recentIssueCount++;
    }
  });
  var list = Object.keys(byTeacher).map(function(k){ return byTeacher[k]; });
  // 大多數老師只會出現在一個部門；極少數情況（同一位老師同時教普通班跟二外/辛班）就把部門都列出來，不隱藏這個狀況。
  list.forEach(function(e){
    e.avgScore = e.scoreCount ? (e.scoreSum / e.scoreCount) : null;
    e.deptLabel = Object.keys(e.deptSet).map(function(d){ return DEPT_LABELS[d]; }).join('、');
  });
  list.sort(function(a,b){
    if(b.recentIssueCount !== a.recentIssueCount) return b.recentIssueCount - a.recentIssueCount;
    if(b.issueCount !== a.issueCount) return b.issueCount - a.issueCount;
    var aa = a.avgScore == null ? 99 : a.avgScore, bb = b.avgScore == null ? 99 : b.avgScore;
    return aa - bb;
  });
  return list;
}
// 「未巡堂」：輪值表（ROSTER）上有排定巡堂人員的節次，但找不到對應的巡堂紀錄，且這個節次已經過了
// （還沒到的節次不算「漏」，只是還沒發生）。判斷「有沒有對應紀錄」直接沿用送出紀錄時就算好的
// scheduled 欄位（date+period 都吻合、且 patrolName 跟輪值表當天該節次的人一致才會是 true），
// 不用再重新比對一次文字是否相同，邏輯跟畫面上「輪值人員／主動巡堂」badge 是同一套標準。
// monthStr 給 'YYYY-MM' 只掃那個月；留空掃整個學期（但一樣不會掃到還沒發生的未來）。
//
// 巡堂排班實際上是「兩節一組」（輪值表資料本身也印證這點：同一天同一人永遠連續排兩節，
// 1-2節、3-4節、5-6節、7-8節），只要這兩節裡有任何一節送出巡堂紀錄就算這組巡堂完成，
// 不是每一節都要分開送。所以這裡要用「節次組」而不是逐節去跟巡堂紀錄比對，
// 不然兩節其實只巡一次，卻會被誤判成少了一節、多算一倍的未巡堂次數。
var PERIOD_PAIRS = [['1','2'],['3','4'],['5','6'],['7','8']];
// 未巡堂清單正式上線前的資料不算數：那時候系統還沒正式推行，同仁可能根本不知道
// 要用這套工具送紀錄，拿那段時間的「未巡堂」去認定會造成不必要的誤解/壓力。
// 2026-10-13 是巡堂紀錄從 Cowork Artifact 搬到 GitHub Pages 正式上線的日期，但那天系統還在更新中，
// 使用者確認改成從隔天 2026-10-14 開始算未巡堂（之前不管是舊 Artifact 時期、更早、還是上線當天都不計入）。
var MISSED_PATROL_START_DATE = '2026-10-14';
function periodByKey(key){ return PERIODS.filter(function(p){ return p.key === key; })[0]; }
function computeMissedPatrols(monthStr){
  var today = taipeiNow().dateStr;
  var nowHHMM = taipeiNow().hhmm;
  var rangeStart = monthStr ? (monthStr + '-01') : SEMESTER_START;
  var rangeEnd;
  if(monthStr){
    var y = Number(monthStr.slice(0,4)), m = Number(monthStr.slice(5,7));
    var lastDay = new Date(Date.UTC(y, m, 0)).getUTCDate(); // 當月最後一天
    rangeEnd = monthStr + '-' + pad2(lastDay);
  }else{
    rangeEnd = SEMESTER_END;
  }
  if(rangeStart < SEMESTER_START) rangeStart = SEMESTER_START;
  if(rangeStart < MISSED_PATROL_START_DATE) rangeStart = MISSED_PATROL_START_DATE;
  if(rangeEnd > SEMESTER_END) rangeEnd = SEMESTER_END;
  if(rangeEnd > today) rangeEnd = today; // 還沒到的日期不算
  if(rangeStart > rangeEnd) return [];

  var scheduledSet = {};
  // 補巡判斷用：老師有時候排定的節次真的有事去不了，會習慣改到同一週內其他時段主動補巡，不是每次都
  // 剛好補在原本排定的那一節／那一天。只要「同一週」內，這位應巡堂人員有送出任何一筆巡堂紀錄（不限
  // 節次、也不限是不是輪值人員紀錄），就算這組巡堂義務已經用別的時段補過，不列入未巡堂清單——老師願意
  // 多巡堂本來就是好事，不用卡在剛好哪一天。
  // 「同一週」直接用 WEEK_CALENDAR 本身切出來的那個區間（start~end），不是一般禮拜一到禮拜日的算法：
  // 非淨空週的區間本來就含六、日（那兩天也排巡堂），淨空週的區間雖然形式上一樣是7天一段，但六、日
  // 本來就沒有排定巡堂（學生不在校），所以共用同一套「區間」概念不會把兩種週混在一起算錯。
  var recordsByNameDate = {};
  RECORDS.forEach(function(r){
    if(r.scheduled) scheduledSet[r.date + '|' + r.period] = true;
    recordsByNameDate[r.patrolName + '|' + r.date] = true;
  });
  function weekEntryFor(dateStr){
    for(var i=0;i<WEEK_CALENDAR.length;i++){
      var wk = WEEK_CALENDAR[i];
      if(dateStr >= wk.start && dateStr <= wk.end) return wk;
    }
    return null;
  }
  function hasRecordSameWeek(name, dateStr){
    var wk = weekEntryFor(dateStr);
    if(!wk) return false;
    var dcursor = parseISODateUTC(wk.start);
    var dend = parseISODateUTC(wk.end);
    while(dcursor.getTime() <= dend.getTime()){
      if(recordsByNameDate[name + '|' + formatISODateUTC(dcursor)]) return true;
      dcursor = addDaysUTC(dcursor, 1);
    }
    return false;
  }

  var missed = [];
  var cursor = parseISODateUTC(rangeStart);
  var endD = parseISODateUTC(rangeEnd);
  while(cursor.getTime() <= endD.getTime()){
    var dateStr = formatISODateUTC(cursor);
    var info = dateToInfo(dateStr);
    if(info && info.valid){
      PERIOD_PAIRS.forEach(function(pair){
        var duty = dutyFor(info.weekType, info.day, pair[0]) || dutyFor(info.weekType, info.day, pair[1]);
        if(!duty) return; // 這個節次組沒有排定巡堂人員，不算
        var p2 = periodByKey(pair[1]);
        if(dateStr === today && p2.end > nowHHMM) return; // 這組節次今天還沒下課，不算
        var fulfilled = scheduledSet[dateStr + '|' + pair[0]] || scheduledSet[dateStr + '|' + pair[1]];
        if(!fulfilled){
          fulfilled = hasRecordSameWeek(duty.name, dateStr);
        }
        if(!fulfilled){
          missed.push({date: dateStr, day: info.day, periodFrom: pair[0], periodLabel: '第'+pair[0]+'-'+pair[1]+'節', weekType: info.weekType, duty: duty});
        }
      });
    }
    cursor = addDaysUTC(cursor, 1);
  }
  missed.sort(function(a,b){ return (b.date + b.periodFrom).localeCompare(a.date + a.periodFrom); });
  return missed;
}
// 未巡堂清單如果照節次一筆一筆列，一個月下來（輪值表幾乎每節都排人）很容易上百筆、看了反而抓不到重點。
// 改成先依「應巡堂人員」彙整成一張小表（誰漏了幾次、最近一次漏什麼時候），一眼就看得出要提醒誰；
// 逐節的明細收在「顯示明細清單」展開按鈕後面，需要時才看。
function groupMissedByPerson(missedList){
  var byPerson = {};
  missedList.forEach(function(it){
    var key = it.duty.name + '|' + it.duty.dept + '|' + it.duty.title;
    var e = byPerson[key] = byPerson[key] || {name: it.duty.name, dept: it.duty.dept, title: it.duty.title, count: 0, lastItem: null};
    e.count++;
    if(!e.lastItem || (it.date + it.periodFrom) > (e.lastItem.date + e.lastItem.periodFrom)) e.lastItem = it;
  });
  var list = Object.keys(byPerson).map(function(k){ return byPerson[k]; });
  list.sort(function(a,b){
    if(b.count !== a.count) return b.count - a.count;
    return (b.lastItem.date + b.lastItem.periodFrom).localeCompare(a.lastItem.date + a.lastItem.periodFrom);
  });
  return list;
}

  return html;
}
function statTileHtml(label, value, extraClass){

// 最上面的關鍵數字摘要：一打開總覽先看到整體狀況，不用先往下捲兩個列表才知道量體。
function overviewStatsHtml(){
  var today = taipeiNow().dateStr;
  var thisMonth = today.slice(0,7);
  var monthRecords = RECORDS.filter(function(r){ return r.date.slice(0,7) === thisMonth; });
  // 「本月平均分數」改掉了：每位老師、每堂課的狀況本來就不一樣，混在一起平均沒有實際意義，
  // 改成「近4週重複示警老師數」──同一位老師近4週內累計 >= ATTENTION_REPEAT_THRESHOLD 次問題，
  // 直接對應「有幾位老師需要我親自跟進」，比一個抽象的平均分數更能回答使用者真正在意的事。
  var repeatTeacherCount = computeTeacherSummary().filter(function(e){
    return e.recentIssueCount >= ATTENTION_REPEAT_THRESHOLD;
  }).length;
  var attentionRecentCount = computeAttention().filter(function(it){
    var ageDays = daysBetweenISO(it.record.date, today);
    return ageDays >= 0 && ageDays <= ATTENTION_WINDOW_DAYS;
  }).length;
  var deptCounts = {regular:0, intl:0, secondlang:0};
  RECORDS.forEach(function(r){ deptCounts[recordDept(r)]++; });
  var total = RECORDS.length || 1;
  var pct = function(n){ return Math.round(n/total*100); };
  var deptPctText = '普通班 '+pct(deptCounts.regular)+'% · 國際部 '+pct(deptCounts.intl)+'% · 外語中心 '+pct(deptCounts.secondlang)+'%';
  var html = '<div class="card"><div class="stat-grid">';
  html += statTileHtml('本月巡堂次數', monthRecords.length);
  html += statTileHtml('近4週重複示警老師數', repeatTeacherCount);
  html += statTileHtml('待關注（近4週）', attentionRecentCount);
  html += statTileHtml('部門占比（累計）', deptPctText, 'small');
  html += '</div></div>';
  return html;
}

  // 避免選了「國際部」結果待關注清單還是混著全校資料、看起來前後不一致。

    // （清單本身已經被月份篩選框住，不會無限變長）。

  html += '</select>';

  html += '</div>';

  html += '<div class="card">';
  html += '<h2 style="font-size:16px;margin-bottom:10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">未巡堂清單'
    + '<button type="button" class="btn-link" data-action="toggle-missed-rule-hint" style="font-size:12px;font-weight:400;">ⓘ 補巡怎麼算？</button></h2>';
  html += '<div class="hint" style="margin-bottom:10px;">輪值表上排定要巡堂、但時間已經過了卻找不到對應巡堂紀錄的節次，依應巡堂人員彙整，次數多的排前面。</div>';
  if(uiState.overviewShowMissedRuleHint){
    html += '<div class="hint" style="margin-bottom:10px;">補巡認定：原本排定的節次如果沒送紀錄，只要這位應巡堂人員在同一週內（跟行事曆的非淨空週／淨空週區間一致），有送出任何一筆巡堂紀錄（不限節次、不限哪一天），就算已經改時段補巡完成，不會列入下面這份清單。</div>';

var LEGACY_CONTEXT_COL = 26;
var LEGACY_NO_TEACHER_CATS = ['外堂課', '班會/彈性學習時間/自習', ''];
var LEGACY_TITLE_SUFFIXES = ['副主任', '副校長', '主任', '校長', '老師', '顧問'];

function parseCsv(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  var rows = [], row = [], field = '', inQuotes = false;
  var i = 0, len = text.length;
  while(i < len){
    var ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += ch; i++; continue;
    }else{
      if(ch === '"'){ inQuotes = true; i++; continue; }
      if(ch === ','){ row.push(field); field = ''; i++; continue; }
      if(ch === '\r'){ i++; continue; }
      if(ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += ch; i++; continue;
    }
  }
  row.push(field);
  if(row.length > 1 || row[0] !== '') rows.push(row);
  return rows;
}
function cleanLegacyName(raw){
  if(!raw) return '';
  var s = String(raw).replace(/\s+/g, '');
  for(var i=0;i<LEGACY_TITLE_SUFFIXES.length;i++){
    var suf = LEGACY_TITLE_SUFFIXES[i];
    if(s.length > suf.length && s.slice(-suf.length) === suf){ s = s.slice(0, -suf.length); break; }
  }
  return s;
}
function parseLegacyTimestamp(raw){
  if(!raw) return null;
  // Excel/試算表匯入（xlsx）：SheetJS 用 cellDates:true 讀出的日期儲存格是 Date 物件，
  // 而且它的 UTC 欄位（getUTCFullYear 等）直接對應試算表上看到的年月日時分秒（試算表日期本身沒有時區概念），
  // 要用 getUTC* 讀，不能用本地時區的 getFullYear 等，不然會因為瀏覽器時區設定跑掉。
  if(raw instanceof Date){
    if(isNaN(raw.getTime())) return null;
    return {y:raw.getUTCFullYear(), mo:raw.getUTCMonth()+1, d:raw.getUTCDate(), h:raw.getUTCHours(), mi:raw.getUTCMinutes(), s:raw.getUTCSeconds(), ms:raw.getUTCMilliseconds()};
  }
  var s = String(raw).trim();
  var m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2})(?:[.,](\d+))?)?/);
  if(!m) return null;
  var ms = m[7] ? parseInt((m[7]+'000').slice(0,3), 10) : 0;
  return {y:+m[1], mo:+m[2], d:+m[3], h:+m[4], mi:+m[5], s:+(m[6]||0), ms:ms};
}
function taipeiComponentsToUtcIso(y,mo,d,h,mi,s,ms){
  var dt = new Date(Date.UTC(y, mo-1, d, h, mi, s, ms) - 8*3600000);
  return dt.getUTCFullYear()+'-'+pad2(dt.getUTCMonth()+1)+'-'+pad2(dt.getUTCDate())+'T'
    +pad2(dt.getUTCHours())+':'+pad2(dt.getUTCMinutes())+':'+pad2(dt.getUTCSeconds())+'.'
    +String(dt.getUTCMilliseconds()).padStart(3,'0')+'Z';
}
function splitLegacyChecklist(raw, validList, warnings, rowNum, label){
  if(!raw) return [];
  var out = [];
  String(raw).replace(/，/g, ',').split(',').forEach(function(item){
    item = item.trim();
    if(!item) return;
    if(validList.indexOf(item) !== -1) out.push(item);
    else warnings.push('第'+rowNum+'列：未知的'+label+'項目「'+item+'」，已捨棄');
  });
  return out;
}
function parseLegacyRow(cols, rowNum, warnings, unmappedSet){
  var get = function(i){ return cols[i] != null ? String(cols[i]) : ''; };
  var ts = parseLegacyTimestamp(cols[0]); // 不要先經過 get()：xlsx 來源的時間戳記是 Date 物件，stringify 後就解析不出來了
  if(!ts) return null;
  var category = get(4).trim();
  var className = (get(2).trim() + get(3).trim()).trim();
  if(!className){ warnings.push('第'+rowNum+'列：年段/班別缺失，略過'); return null; }
  var patrolName = cleanLegacyName(get(1));
  if(!patrolName){ warnings.push('第'+rowNum+'列：巡堂人員缺失，略過'); return null; }
  var subjectTeacher = '', noteContext = '';
  if(LEGACY_SUBJECT_TEACHER_COL.hasOwnProperty(category)){
    subjectTeacher = cleanLegacyName(get(LEGACY_SUBJECT_TEACHER_COL[category]));
  }else if(LEGACY_NO_TEACHER_CATS.indexOf(category) !== -1){
    var ctx = get(LEGACY_CONTEXT_COL).trim();
    if(ctx) noteContext = ctx;
  }else{
    unmappedSet[category || '（空白）'] = true;
    var ctx2 = get(LEGACY_CONTEXT_COL).trim();
    if(ctx2) noteContext = ctx2;
  }
  var periodNum = parseInt(parseFloat(get(15)), 10);
  if(!periodNum || isNaN(periodNum) || periodNum < 1 || periodNum > 8){
    warnings.push('第'+rowNum+'列：節次無法解析「'+get(15)+'」，略過'); return null;
  }
  var period = String(periodNum);
  var scoreRaw = get(13).trim();
  var score = null;
  if(scoreRaw){ var sv = parseInt(parseFloat(scoreRaw), 10); if(!isNaN(sv)) score = sv; }
  var note = get(14).trim();
  if(noteContext){
    var tag = '（授課安排：'+noteContext+'）';
    note = note ? (note+' '+tag) : tag;
  }
  var pros = splitLegacyChecklist(get(11), PROS, warnings, rowNum, '優點');
  var cons = splitLegacyChecklist(get(12), CONS, warnings, rowNum, '缺點');
  var dateStr = ts.y+'-'+pad2(ts.mo)+'-'+pad2(ts.d);
  var microStr = String(ts.ms*1000).padStart(6,'0');
  var legacyId = 'legacy-'+ts.y+pad2(ts.mo)+pad2(ts.d)+'T'+pad2(ts.h)+pad2(ts.mi)+pad2(ts.s)+microStr;
  var createdAt = taipeiComponentsToUtcIso(ts.y, ts.mo, ts.d, ts.h, ts.mi, ts.s, ts.ms);
  var info = dateToInfo(dateStr);
  var weekType = (info && info.valid) ? info.weekType : null;
  var day = info ? info.day : null;
  if(!info || !info.valid) warnings.push('第'+rowNum+'列：'+dateStr+' 不在目前課表行事曆範圍內，仍會匯入但缺少排定巡堂標記');
  var duty = (info && info.valid) ? dutyFor(info.weekType, info.day, period) : null;
  var scheduled = !!(duty && duty.name === patrolName);
  // 舊表單本身沒有「課程名稱」欄位、有些類別也沒有任課老師，這裡用課表補：只填目前還空著的部分，
  // 不覆蓋舊表單已經填好的任課老師（可能是調代課當下真正的人，比課表預設更準）。
  var subject = '';
  var gridHit = (info && info.valid) ? lookupSubjectTeacher(className, info.weekType, info.day, period) : null;
  if(gridHit){
    if(gridHit.subject) subject = gridHit.subject;
    if(!subjectTeacher && gridHit.teacherNames.length) subjectTeacher = gridHit.teacherNames.join('、');
  }
  return {
    id: legacyId, createdAt: createdAt, updatedAt: createdAt,
    date: dateStr, weekType: weekType, day: day, period: period,
    className: className, patrolName: patrolName, scheduled: scheduled,
    subject: subject, subjectTeacher: subjectTeacher, pros: pros, cons: cons, score: score, note: note,
    creatorToken: 'legacy-form-import'
  };
}
function handleImportFile(text, fileName){
  try{
    var rows = parseCsv(text);
    processImportRows(rows, fileName);
  }catch(e){
    uiState.importState = {error: '解析檔案時發生問題：' + (e && e.message ? e.message : String(e))};
    render();
  }
}
function handleImportXlsx(arrayBuffer, fileName){
  try{
    if(typeof XLSX === 'undefined'){
      uiState.importState = {error:'Excel 解析功能載入失敗（可能是網路問題），請重新整理頁面後再試一次，或改上傳 CSV 檔。'};
      render(); return;
    }
    // cellDates:true 讓時間戳記欄位直接變成 Date 物件（見 parseLegacyTimestamp 的說明），
    // 不然預設會讀成 Excel 內部的序列數字，沒辦法直接解析出年月日時分秒。
    var wb = XLSX.read(arrayBuffer, {type:'array', cellDates:true});
    var sheetName = wb.SheetNames.indexOf('表單回應 1') !== -1 ? '表單回應 1' : wb.SheetNames[0];
    var ws = wb.Sheets[sheetName];
    var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    processImportRows(rows, fileName);
  }catch(e){
    uiState.importState = {error: '解析 Excel 檔案時發生問題：' + (e && e.message ? e.message : String(e))};
    render();
  }
}
// legacy id 格式是 'legacy-'+YYYYMMDD+'T'+HHMMSS+微秒（6碼）。秒以下的微秒部分是從試算表的日期
// 數值換算回來的，CSV（Python/openpyxl）跟 Excel（瀏覽器端 SheetJS）兩種讀法換算同一個儲存格，
// 偶爾會有 ±1 毫秒的浮點數捨入差異（兩套程式各自的日期序號轉換邏輯不同，無法完全消除）。
// 如果只用完整 id 字串比對，同一筆舊紀錄換一種檔案格式重新匯入，可能因為這 1 毫秒差異被誤判成
// 「新資料」而重複寫入。所以比對是否已匯入過時，忽略微秒部分、只看到「秒」為止；id 本身（含微秒）
// 仍然完整保留、正常寫入新紀錄，不影響既有資料格式。
function legacySecondKey(id){
  return (typeof id === 'string' && id.indexOf('legacy-') === 0 && id.length > 6) ? id.slice(0, -6) : id;
}
function processImportRows(rows, fileName){
  try{
    if(!rows.length){ uiState.importState = {error:'檔案是空的，或無法解析出任何資料列。'}; render(); return; }
    var dataRows = rows.slice(1);
    var warnings = [], unmappedSet = {};
    var existingIds = {}, existingSecondKeys = {};
    RECORDS.forEach(function(r){ existingIds[r.id] = true; existingSecondKeys[legacySecondKey(r.id)] = true; });
    var newRows = [], dupCount = 0, skippedCount = 0;
    dataRows.forEach(function(cols, idx){
      var rowNum = idx + 2;
      if(!cols.length || cols.every(function(c){ return !c || !String(c).trim(); })) return;
      var rec = parseLegacyRow(cols, rowNum, warnings, unmappedSet);
      if(!rec){ skippedCount++; return; }
      if(existingIds[rec.id] || existingSecondKeys[legacySecondKey(rec.id)]){ dupCount++; return; }
      existingIds[rec.id] = true;
      existingSecondKeys[legacySecondKey(rec.id)] = true;
      newRows.push(rec);
    });
    uiState.importState = {
      parsed: true, fileName: fileName, totalDataRows: dataRows.length,
      newRows: newRows, dupCount: dupCount, skippedCount: skippedCount,
      warnings: warnings, unmappedCats: Object.keys(unmappedSet)
    };
  }catch(e){
    uiState.importState = {error: '解析檔案時發生問題：' + (e && e.message ? e.message : String(e))};
  }
  render();
}
function confirmImport(){
  var st = uiState.importState;
  if(!st || !st.newRows || !st.newRows.length) return;
  var msg = '已匯入 ' + st.newRows.length + ' 筆舊表單紀錄。';
  var rows = st.newRows;
  uiState.importState = null;
  saveManyRecords(rows, msg);
}
function importHtml(){
  var st = uiState.importState;
  var html = '<div class="card">';
  html += '<h2 style="font-size:16px;margin-bottom:10px;">匯入舊版 Google 表單紀錄</h2>';
  html += '<div class="hint" style="margin-bottom:10px;line-height:1.6;">如果有同事繼續使用舊的 Google 表單巡堂，把表單回覆試算表（「表單回應 1」工作表）下載後上傳到這裡即可，Excel（.xlsx）或 CSV 檔都可以，不用特別轉檔。系統會用每筆的原始填寫時間自動判斷是否已經匯入過，只會把新的紀錄加進來，不會重複。</div>';
  html += '<input type="file" id="import-file-input" accept=".csv,text/csv,.xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel">';
  if(st && st.error){
    html += '<div class="record-note" style="color:var(--bad);margin-top:10px;">'+esc(st.error)+'</div>';
  }else if(st && st.parsed){
    html += '<div class="now-banner" style="margin-top:12px;">共讀到 '+st.totalDataRows+' 列資料，其中 <b>'+st.newRows.length+' 筆是新資料</b>，'+st.dupCount+' 筆已匯入過（自動略過）'+(st.skippedCount?'，'+st.skippedCount+' 列缺少必要欄位或無法解析（略過）':'')+'。</div>';
    if(st.warnings.length){
      html += '<div class="record-note" style="margin-top:8px;">提醒：'+st.warnings.slice(0,10).map(esc).join('；')+(st.warnings.length>10?'…等共 '+st.warnings.length+' 項':'')+'</div>';
    }
    if(st.unmappedCats.length){
      html += '<div class="record-note" style="color:var(--warn);margin-top:8px;">出現未對應過的「類別」：'+st.unmappedCats.map(esc).join('、')+'，這幾筆的任課老師欄位會留空，可能需要再請系統管理者更新對應規則。</div>';
    }
    if(st.newRows.length){
      html += '<button type="button" class="btn-primary" style="margin-top:12px;" data-action="confirm-import" '+((isReadOnly||uiState.syncing)?'disabled':'')+'>'+(uiState.syncing?'匯入中…':'確認匯入這 '+st.newRows.length+' 筆')+'</button>';
    }
  }
  html += '</div>';
  return html;
}

// 整頁用 innerHTML 重繪時，原本正在輸入的欄位會被整個換成新的 DOM 節點而失焦（手機上打字打到一半
// 畫面重繪、游標跳掉會很困擾）；這裡記住重繪前「正在輸入哪個欄位、游標在哪裡」，重繪完再還原。
// 資料庫連線狀態列：載入中／連不到資料庫／正在送出，顯示在分頁籤下方，所有頁籤共用
function syncStatusHtml(){
  var html = '';
  if(uiState.loading){
    html += '<div class="sync-bar sync-bar-loading">正在向資料庫讀取最新紀錄…</div>';
  }else if(uiState.syncError){
    html += '<div class="sync-bar sync-bar-error">'+esc(uiState.syncError)+' <button type="button" class="btn-ghost" data-action="refresh-data" style="margin-left:8px;">重新整理</button></div>';
  }
  if(uiState.syncing){
    html += '<div class="sync-bar sync-bar-loading">處理中，請稍候…</div>';
  }
  return html;
}
function render(){
  var app = document.getElementById('app');
  var active = document.activeElement;
  var focusId = (active && active.id && app.contains(active)) ? active.id : null;
  var selStart = null, selEnd = null;
  if(focusId && typeof active.selectionStart === 'number'){ selStart = active.selectionStart; selEnd = active.selectionEnd; }
  var html = '';
  html += '<div class="topbar">';
  html += '<div class="brand"><h1>巡堂紀錄</h1><span class="sub">普台高級中學</span></div>';
  html += '<div class="nav-link-row"><a class="nav-link-btn" href="https://cocaches-putai.github.io/Putai_class/" target="_blank" rel="noopener">課表查詢系統 →</a></div>';
  html += nowBannerHtml();
  html += '<div class="tabs">';
  html += '<button type="button" class="tab-btn" aria-selected="'+(uiState.tab==='new')+'" data-action="set-tab" data-tab="new">填寫巡堂</button>';
  var historyLabel = uiState.initialLoadDone ? ('歷史紀錄（'+RECORDS.length+'）') : '歷史紀錄（讀取中…）';
  html += '<button type="button" class="tab-btn" aria-selected="'+(uiState.tab==='history')+'" data-action="set-tab" data-tab="history">'+historyLabel+'</button>';
  html += '<button type="button" class="tab-btn" aria-selected="'+(uiState.tab==='overview')+'" data-action="set-tab" data-tab="overview">總覽</button>';
  html += '<button type="button" class="tab-btn" aria-selected="'+(uiState.tab==='import')+'" data-action="set-tab" data-tab="import">匯入舊紀錄</button>';
  html += '</div></div>';
  html += syncStatusHtml();
  html += uiState.tab === 'new' ? formHtml() : (uiState.tab === 'history' ? historyHtml() : (uiState.tab === 'overview' ? overviewHtml() : importHtml()));
  if(uiState.toast) html += '<div class="toast">'+esc(uiState.toast)+'</div>';
  app.innerHTML = html;
  bindInputs();
  if(focusId){
    var again = document.getElementById(focusId);
    // 下拉選單（年段/班級/節次...）不還原焦點：這個機制原本是為了保留文字輸入框打字打到一半的游標位置，
    // 但 <select> 選完值之後畫面重繪又把焦點拉回同一顆下拉選單，部分瀏覽器（尤其手機）會讓選單看起來
    // 又彈出來一次、或畫面跟著跳動，使用者會覺得「選了好像沒選到」。
    if(again && again.tagName !== 'SELECT'){
      again.focus();
      if(selStart != null && typeof again.setSelectionRange === 'function'){
        try{ again.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

// 「date / period / className」三個欄位會影響畫面上其他地方（衍生出的星期/週別、輪值建議、是否要顯示
// 「其他地點」輸入框），需要整頁重繪；其他欄位（姓名、自填地點、備註）純粹只是存狀態，不重繪，
// 避免每打一個字就整頁重繪，導致輸入中的游標位置跑掉、甚至在測試/快速操作時跟 Playwright 的點擊動作打架。
var RERENDER_BINDS = {className:1, date:1, period:1, grade:1};
function bindInputs(){
  var app = document.getElementById('app');
  app.querySelectorAll('[data-bind]').forEach(function(el){
    var key = el.getAttribute('data-bind');
    var handler = function(){
      uiState.form[key] = el.value;
      if(key === 'subjectTeacher') uiState.form.subjectTeacherTouched = true;
      if(key === 'subject') uiState.form.subjectTouched = true;
      if(key === 'grade'){
        // 換年段：如果原本選的班級不屬於新年段（或選了「其他」），就重新清空讓使用者重選，
        // 避免畫面上留著一個跟新年段對不上、卻看起來像有選的班級值。
        var g = uiState.form.grade;
        if(g === '__other__'){
          uiState.form.className = '__other__';
        }else if(g === '__secondlang__'){
          uiState.form.className = '__secondlang__';
        }else{
          var list = CLASSES_BY_GRADE[g] || [];
          if(list.indexOf(uiState.form.className) === -1){ uiState.form.className = ''; }
        }
      }
      if(RERENDER_BINDS[key]){ refreshSubjectTeacherSuggestion(); render(); }
    };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });
  app.querySelectorAll('[data-filter]').forEach(function(el){
    var fkey = el.getAttribute('data-filter');
    var fhandler = function(){
      uiState.filter[fkey] = el.value;
      render();
    };
    el.addEventListener('input', fhandler);
    el.addEventListener('change', fhandler);
  });
  // 總覽頁籤自己的部門篩選，跟歷史紀錄的 uiState.filter 分開存，兩邊篩選互不影響。
  app.querySelectorAll('[data-ovfilter]').forEach(function(el){
    var okey = el.getAttribute('data-ovfilter');
    var ohandler = function(){
      uiState[okey] = el.value;
      render();
    };
    el.addEventListener('input', ohandler);
    el.addEventListener('change', ohandler);
  });
  var importFileInput = app.querySelector('#import-file-input');
  if(importFileInput){
    importFileInput.addEventListener('change', function(){
      var file = importFileInput.files && importFileInput.files[0];
      if(!file) return;
      var isXlsx = /\.xlsx?$/i.test(file.name);
      var reader = new FileReader();
      reader.onerror = function(){ uiState.importState = {error:'檔案讀取失敗，請重新選擇檔案。'}; render(); };
      if(isXlsx){
        reader.onload = function(){ handleImportXlsx(reader.result, file.name); };
        reader.readAsArrayBuffer(file);
      }else{
        reader.onload = function(){ handleImportFile(String(reader.result), file.name); };
        reader.readAsText(file, 'utf-8');
      }
    });
  }
}

document.addEventListener('click', function(e){
  var btn = e.target.closest('[data-action]');
  if(!btn) return;
  var action = btn.getAttribute('data-action');
  if(action === 'set-tab'){ uiState.tab = btn.getAttribute('data-tab'); render(); }
  else if(action === 'toggle-pro'){ var it=btn.getAttribute('data-item'); uiState.form.pros[it] = !uiState.form.pros[it]; render(); }
  else if(action === 'toggle-con'){ var it2=btn.getAttribute('data-item'); uiState.form.cons[it2] = !uiState.form.cons[it2]; render(); }
  else if(action === 'set-score'){ uiState.form.score = Number(btn.getAttribute('data-score')); render(); }
  else if(action === 'apply-suggest'){ uiState.form.patrolName = btn.getAttribute('data-name'); render(); }
  else if(action === 'reset-subject-teacher'){ uiState.form.subjectTeacherTouched = false; refreshSubjectTeacherSuggestion(); render(); }
  else if(action === 'reset-subject'){ uiState.form.subjectTouched = false; refreshSubjectTeacherSuggestion(); render(); }
  else if(action === 'submit-form'){ onSubmit(); }
  else if(action === 'cancel-edit'){ cancelEdit(); }
  else if(action === 'edit-record'){ startEdit(btn.getAttribute('data-id')); }
  else if(action === 'delete-record'){ deleteRecord(btn.getAttribute('data-id')); }
  else if(action === 'export-csv'){ exportCsv(); }
  else if(action === 'copy-csv'){ copyCsv(); }
  else if(action === 'confirm-import'){ confirmImport(); }
  else if(action === 'refresh-data'){ fetchRecordsFromServer(true); }
  else if(action === 'show-all-attention'){ uiState.overviewShowAllAttention = true; render(); }
  else if(action === 'hide-old-attention'){ uiState.overviewShowAllAttention = false; render(); }
  else if(action === 'show-missed-detail'){ uiState.overviewShowMissedDetail = true; render(); }
  else if(action === 'hide-missed-detail'){ uiState.overviewShowMissedDetail = false; render(); }
  else if(action === 'toggle-missed-rule-hint'){ uiState.overviewShowMissedRuleHint = !uiState.overviewShowMissedRuleHint; render(); }
});

render();
// 畫面先用內嵌快照顯示，同時非同步向 Google 試算表資料庫要最新資料。
fetchRecordsFromServer(false);

</script><script>(function(){ var fn = new Function(document.getElementById('app-logic').textContent); fn(); })();</script></body></html>
